packages:
  - "packages/*"
  - "apps/*"
# Versions shared by several package.json files. Playwright Test and playwright move together.
catalog:
  "@playwright/test": 1.65.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  oxc-transform-react: 0.158.0
  playwright: 1.65.1
  react: 19.3.1
  react-dom: 19.3.1
  vite: 8.3.8
  zod: 4.6.7

allowBuilds:
  esbuild: true
  ffmpeg-static: false
  sharp: true
  workerd: true

# Verified against Babel and both Vite environments by the compiler checks.
peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react>oxc-transform-react": "0.148.0"
