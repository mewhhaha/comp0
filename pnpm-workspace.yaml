packages:
  - "packages/*"
  - "apps/*"
# Versions shared by several package.json files. Playwright Test and playwright move together.
catalog:
  "@playwright/test": 1.64.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  oxc-transform-react: 0.153.0
  playwright: 1.64.0
  react: 19.3.0
  react-dom: 19.3.0
  vite: 8.3.4
  zod: 4.6.5

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Verified against Babel and both Vite environments by the compiler checks.
peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react>oxc-transform-react": "0.148.0"
